<!-- THEME -->
<script>
  (function () {
    const saved = localStorage.getItem('theme');
    if (saved === 'light') document.documentElement.classList.add('light');
  })();

  function toggleTheme() {
    const isLight = document.documentElement.classList.toggle('light');
    localStorage.setItem('theme', isLight ? 'light' : 'dark');
    document.getElementById('theme-icon').textContent  = isLight ? '☽' : '☀';
    document.getElementById('theme-label').textContent = isLight ? 'Escuro' : 'Claro';
  }

  document.addEventListener('DOMContentLoaded', function () {
    const isLight = document.documentElement.classList.contains('light');
    document.getElementById('theme-icon').textContent  = isLight ? '☽' : '☀';
    document.getElementById('theme-label').textContent = isLight ? 'Escuro' : 'Claro';
  });

  function toggleFGroup(id) {
    const grp = document.getElementById(id);
    grp.classList.toggle('open');
  }
</script>

<!-- SCRIPT DA IA IA-->

<!-- Motor de IA e Simulação por Voz (Versão Estável com Dynamic Import) -->
<script type="module">
    // 1. Mapeamento dos botões (A Interface)
    const btnAbrirIa = document.getElementById("btn-abrir-ia");
    const btnFecharIa = document.getElementById("btn-fechar-ia");
    const drawer = document.getElementById("ia-drawer");
    const overlay = document.getElementById("ia-overlay");
    const tituloDrawer = document.getElementById("titulo-ia-drawer");

    const btnIniciar = document.getElementById("btn-iniciar");
    const btnFalar = document.getElementById("btn-falar");
    const btnFinalizar = document.getElementById("btn-finalizar");
    const statusIa = document.getElementById("status-ia");
    const chatBox = document.getElementById("chat-box");
    const avisoHardware = document.getElementById("aviso-hardware-ia");

    const areaDebriefing = document.getElementById("area-debriefing");
    const resultadoAvaliacao = document.getElementById("resultado-avaliacao");
    const btnQuiz = document.getElementById("btn-quiz");
    const btnResumo = document.getElementById("btn-resumo");
    const conteudoEstudo = document.getElementById("conteudo-estudo");

    let engine = null;
    const modeloSelecionado = "Phi-3-mini-4k-instruct-q4f16_1-MLC";
    let historicoConsulta = [];

    // ==========================================
    // PARTE 1: GARANTIR QUE A ABA ABRE SEMPRE
    // ==========================================
    if (btnAbrirIa) {
        btnAbrirIa.addEventListener("click", () => {
            if (drawer && overlay) {
                drawer.classList.add("aberto");
                overlay.classList.add("ativo");
                
                // Tenta capturar o título do caso
                const elementoTitulo = document.getElementById("sv-title");
                if (elementoTitulo && tituloDrawer) {
                    tituloDrawer.innerText = elementoTitulo.innerText;
                }
            }
        });
    }

    function fecharPainel() {
        if (drawer) drawer.classList.remove("aberto");
        if (overlay) overlay.classList.remove("ativo");
    }
    
    if (btnFecharIa) btnFecharIa.addEventListener("click", fecharPainel);
    if (overlay) overlay.addEventListener("click", fecharPainel);

    // ==========================================
    // PARTE 2: A INTELIGÊNCIA ARTIFICIAL (LAZY LOAD COM FALLBACK EXTREMO)
    // ==========================================
    if (btnIniciar) {
        btnIniciar.addEventListener("click", async () => {
            btnIniciar.disabled = true;
            statusIa.innerText = "Buscando rotas de conexão com a IA...";

            try {
                let webllm = null;
                
                // LISTA DE ROTAS (Tentaremos uma por uma)
                // A ordem é importante: do mais rápido para o mais garantido
                const servidoresCDN = [
                    "https://unpkg.com/@mlc.ai/web-llm@0.2.74/lib/index.js", // Acesso direto ao ficheiro (geralmente não falha)
                    "https://esm.run/@mlc.ai/web-llm", // Oficial (esm.run)
                    "https://cdn.jsdelivr.net/npm/@mlc.ai/web-llm/+esm", // JSDelivr
                    "https://esm.sh/@mlc.ai/web-llm?bundle" // ESM.sh em modo bundle
                ];

                // Tenta cada CDN da lista
                for (const url of servidoresCDN) {
                    try {
                        console.log("A tentar conectar via:", url);
                        webllm = await import(url);
                        console.log("✅ Sucesso ao importar de:", url);
                        break; // Se funcionou, sai do loop imediatamente
                    } catch (err) {
                        console.warn(`❌ Falha na rota ${url}:`, err.message);
                    }
                }

                // Se testámos todos os links e o 'webllm' continua vazio, é porque todos falharam
                if (!webllm) {
                    throw new Error("Não foi possível conectar a nenhum servidor CDN.");
                }

                statusIa.innerText = "A descarregar o motor de IA (aguarde, pode demorar alguns minutos)...";

                engine = await webllm.CreateMLCEngine(modeloSelecionado, {
                    initProgressCallback: (report) => {
                        statusIa.innerText = `A carregar IA: ${Math.round(report.progress * 100)}%`;
                    }
                });

                statusIa.innerText = "Paciente pronto! Prima o botão para falar.";
                btnIniciar.style.display = "none";
                btnFalar.style.display = "block";
                btnFinalizar.style.display = "block";

                historicoConsulta = [
                    {
                        role: "system",
                        content: "Você é um paciente de 55 anos numa consulta de urgência. Queixa-se de dor no peito em aperto iniciada há 1 hora, que irradia para o braço esquerdo. É hipertenso e fumador. Responda apenas ao que for perguntado, de forma curta (máximo 2 frases) e com vocabulário leigo."
                    }
                ];
                window.speechSynthesis.getVoices(); 
                
            } catch (erro) {
                console.error("Erro fatal e definitivo na IA:", erro);
                statusIa.innerHTML = `<span style="color: red;">Erro ao conectar. Tente desativar extensões bloqueadoras (AdBlock) ou testar noutra rede.</span>`;
                btnIniciar.disabled = false;
            }
        });
    }

    // ==========================================
    // PARTE 3: MICROFONE E CHAT
    // ==========================================
    const ReconhecimentoVoz = window.SpeechRecognition || window.webkitSpeechRecognition;
    let microfone = null;

    if (ReconhecimentoVoz && btnFalar) {
        microfone = new ReconhecimentoVoz();
        microfone.lang = "pt-BR";
        microfone.interimResults = false;

        btnFalar.addEventListener("mousedown", () => {
            microfone.start();
            btnFalar.innerText = "🎤 A ouvir... (solte para enviar)";
        });

        btnFalar.addEventListener("mouseup", () => {
            microfone.stop();
            btnFalar.innerText = "⏳ A processar...";
        });

        microfone.onresult = async (event) => {
            const texto = event.results[0][0].transcript;
            adicionarMensagem(texto, "medico");
            await responderPaciente(texto);
        };
    }

    async function responderPaciente(texto) {
        historicoConsulta.push({ role: "user", content: texto });
        try {
            const resposta = await engine.chat.completions.create({ messages: historicoConsulta });
            const fala = resposta.choices[0].message.content;
            historicoConsulta.push({ role: "assistant", content: fala });
            adicionarMensagem(fala, "paciente");

            const voz = new SpeechSynthesisUtterance(fala);
            voz.lang = "pt-BR";
            window.speechSynthesis.speak(voz);
        } catch (e) {
            console.error(e);
        } finally {
            if (btnFalar) btnFalar.innerText = "🎤 Segure para Falar";
        }
    }

    function adicionarMensagem(texto, tipo) {
        if (!chatBox) return;
        const msg = document.createElement("div");
        msg.className = `mensagem ${tipo}`;
        msg.innerText = texto;
        chatBox.appendChild(msg);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>
