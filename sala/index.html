<title>Sala de Simulação OSCE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: lobby de estações → porta (impresso) → sala em tela cheia: cena à esquerda, trilho de ferramentas à direita,
   gaveta que abre sobre o lado do médico (o rosto do paciente fica sempre visível), legenda da fala embaixo. */
:root{
  --paper:#F3F6F7; --panel:#FFFFFF; --sunk:#E8EEF0; --line:#D3DDE2; --ink:#13212E; --muted:#556675;
  --accent:#0E766F; --accent-soft:#D6EEEB; --on-accent:#FFFFFF;
  --ok:#2C8A4B; --ok-soft:#DDF1E3; --warn:#B8611A; --warn-soft:#F8E7D7; --crit:#BE3239; --crit-soft:#F7DEDF;
  --stage:#0B141B; --scrim:rgba(9,17,24,.62); --caption:rgba(9,17,24,.78);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1419; --panel:#152029; --sunk:#1B2833; --line:#283844; --ink:#E4ECF1; --muted:#93A5B2;
  --accent:#43B9AE; --accent-soft:#173A38; --on-accent:#06201E;
  --ok:#5CC27E; --ok-soft:#173424; --warn:#E89B57; --warn-soft:#3A2715; --crit:#EF6B71; --crit-soft:#3E1C1F;
  --stage:#05090C; --scrim:rgba(3,7,10,.7); --caption:rgba(3,7,10,.82); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1419; --panel:#152029; --sunk:#1B2833; --line:#283844; --ink:#E4ECF1; --muted:#93A5B2;
  --accent:#43B9AE; --accent-soft:#173A38; --on-accent:#06201E;
  --ok:#5CC27E; --ok-soft:#173424; --warn:#E89B57; --warn-soft:#3A2715; --crit:#EF6B71; --crit-soft:#3E1C1F;
  --stage:#05090C; --scrim:rgba(3,7,10,.7); --caption:rgba(3,7,10,.82); color-scheme:dark}

html,body{height:100%}
#app{height:100%}
[hidden]{display:none!important}
#drawerHost{display:contents}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 14px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.screen{min-height:100%}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Lobby ---------- */
.lobby{max-width:1180px;margin:0 auto;padding-block:32px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:28px}
.lobby-head{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;align-items:end}
.lobby-head h1{font-size:clamp(30px,4.4vw,48px);font-weight:700;letter-spacing:-.01em}
.lobby-head p{color:var(--muted);max-width:60ch;margin:10px 0 0}
.setup{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:8px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:6px;padding:8px 10px;text-align:left;line-height:1.3}
.seg button small{display:block;color:var(--muted);font-size:12px}
.seg button[aria-pressed="true"]{background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.setup-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;font-size:13.5px;color:var(--muted)}
.stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.st-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid;grid-template-rows:auto 1fr;text-align:left;padding:0;transition:border-color .15s, transform .15s}
.st-card:hover:not(:disabled){border-color:var(--accent);transform:translateY(-2px)}
.st-card img{aspect-ratio:16/9;width:100%;object-fit:cover;display:block}
.st-card .body{padding:14px 16px 16px;display:grid;gap:8px;align-content:start}
.st-card h3{font-size:19px}
.st-card .meta{display:flex;flex-wrap:wrap;gap:6px}
.st-card p{margin:0;color:var(--muted);font-size:13.5px}
.st-card:disabled{cursor:default}
.st-card:disabled img{filter:grayscale(.7) opacity(.6)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;border-top:1px solid var(--line);padding-top:22px}
.how div{display:grid;gap:4px;font-size:13.5px;color:var(--muted)}
.how b{color:var(--ink);font-weight:600;font-size:14px}

/* ---------- Porta (impresso) ---------- */
.door{min-height:100%;display:grid;place-items:center;padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--sunk)}
.sheet{background:#FFFEFA;color:#1D232A;width:min(720px,100%);border-radius:4px;box-shadow:0 18px 40px rgba(0,0,0,.18),0 2px 4px rgba(0,0,0,.08);padding:34px clamp(18px,5vw,48px) 30px;position:relative;display:grid;gap:16px}
.sheet::before,.sheet::after{content:"";position:absolute;top:-10px;width:86px;height:24px;background:rgba(214,206,170,.75);transform:rotate(-4deg)}
.sheet::before{left:24px}.sheet::after{right:24px;transform:rotate(5deg)}
.sheet .eyebrow{color:#5F6B74}
.sheet h2{font-size:26px}
.sheet .enun{font-size:15.5px;line-height:1.6;margin:0}
.sheet ol{margin:0;padding-left:20px;display:grid;gap:4px}
.sheet .foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-top:1px dashed #C9C3AE;padding-top:14px}
.sheet .count{font-family:var(--f-mono);font-size:28px;font-weight:600;color:#0E766F}
.sheet .btn{background:#0E766F;border-color:#0E766F;color:#fff}
.sheet .btn.ghost{background:transparent;color:#1D232A;border-color:#C9C3AE}

/* ---------- Sala ---------- */
.room{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--stage)}
.topbar{display:flex;align-items:center;gap:12px;padding-block:8px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.topbar .who{display:grid;min-width:0;line-height:1.25}
.topbar .who b{font-family:var(--f-display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .who span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sp{flex:1}
.timer{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:24px;font-weight:600;padding:2px 12px;border-radius:8px;background:var(--sunk);letter-spacing:.02em}
.timer.warn{background:var(--warn-soft);color:var(--warn)}
.timer.crit{background:var(--crit-soft);color:var(--crit);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:38px;height:38px;display:inline-grid;place-items:center;color:var(--muted)}
.iconbtn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.main{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 84px;min-height:0}
.stage{position:relative;overflow:hidden;min-height:0;background:var(--stage)}
.stage img.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:breathe 7s ease-in-out infinite;transform-origin:70% 45%}
@keyframes breathe{50%{transform:scale(1.012)}}
.stage .vignette{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55),transparent 38%);pointer-events:none}
.stage.dopen .caption{left:calc(430px + (100% - 430px)/2);width:min(640px,calc(100% - 462px))}
.caption{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;width:min(760px,calc(100% - 32px));display:grid;gap:6px;pointer-events:none}
.cap{background:var(--caption);color:#F4F7F9;border-radius:10px;padding:10px 14px;font-size:16.5px;line-height:1.45;backdrop-filter:blur(6px)}
.cap .spk{display:flex;gap:8px;align-items:center;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:#9FD9D2;margin-bottom:2px}
.cap.me{background:rgba(255,255,255,.88);color:#13212E;justify-self:end;max-width:85%;font-size:14.5px}
.cap.me .spk{color:#0E766F}
.cap .emo{font-family:var(--f-body);text-transform:none;letter-spacing:0;color:#C7D3DB;font-size:12px}
.dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:#9FD9D2;margin-right:4px;animation:dot 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{opacity:.25;transform:translateY(-3px)}}
.toast-wrap{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:6;width:min(520px,calc(100% - 32px));pointer-events:none}
.toast{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:9px 12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .25s ease-out}
.toast.crit{border-left-color:var(--crit)}.toast.warn{border-left-color:var(--warn)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}

/* trilho de ferramentas */
.rail{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:8px 6px;overflow:auto}
.tool{border:0;background:transparent;border-radius:8px;padding:9px 2px 7px;display:grid;justify-items:center;gap:4px;font-size:11px;color:var(--muted);position:relative;line-height:1.15;text-align:center}
.tool svg.i{width:24px;height:24px}
.tool:hover{background:var(--sunk);color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tool .badge{position:absolute;top:4px;right:12px;min-width:17px;height:17px;border-radius:9px;background:var(--crit);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px;font-family:var(--f-mono)}

/* gaveta */
.drawer{position:absolute;top:0;bottom:0;left:0;width:min(430px,calc(100% - 84px));background:var(--panel);border-right:1px solid var(--line);z-index:5;display:grid;grid-template-rows:auto minmax(0,1fr);box-shadow:12px 0 32px rgba(0,0,0,.25);animation:din .2s ease-out}
@keyframes din{from{transform:translateX(-14px);opacity:0}}
.drawer header{display:flex;align-items:start;gap:10px;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.drawer header h2{font-size:20px}
.drawer header p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.drawer header .iconbtn{margin-left:auto}
.dbody{overflow:auto;padding:14px 16px 24px;display:grid;gap:16px;align-content:start}
.group{display:grid;gap:6px}
.group > .eyebrow{padding-bottom:2px}
.item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 11px;font-size:14px}
.item:hover:not(:disabled){border-color:var(--accent)}
.item.done{background:var(--sunk)}
.item .st{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap;font-family:var(--f-mono)}
.item.bad{border-color:var(--crit)}
.finding{font-size:13.5px;color:var(--ink);background:var(--accent-soft);border-radius:6px;padding:7px 10px;margin-top:-2px}
.search{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 12px}
.field{display:grid;gap:6px}
.field label{font-weight:600;font-size:14px}
.field small{color:var(--muted);font-size:12.5px}
.field textarea,.field input{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 12px;resize:vertical}
.transcript{display:grid;gap:8px}
.tl{display:grid;gap:2px;font-size:14px}
.tl .w{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.tl.me .w{color:var(--accent)}
.empty{color:var(--muted);font-size:13.5px;border:1px dashed var(--line);border-radius:8px;padding:14px;text-align:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.note{font-size:13px;color:var(--muted)}

/* impressos */
.imp{background:#FFFEFA;color:#1D232A;border:1px solid #E2DCC6;border-radius:6px;padding:12px 14px;display:grid;gap:6px;font-size:14px}
.imp header{display:flex;justify-content:space-between;gap:8px;align-items:baseline;border:0;padding:0}
.imp header b{font-family:var(--f-display);font-size:15px}
.imp header span{font-family:var(--f-mono);font-size:11.5px;color:#6B7178}
.imp .res{font-family:var(--f-mono);font-size:13px;white-space:pre-wrap;line-height:1.55}
.imp .laudo{font-size:13px;color:#3C4650;border-top:1px dashed #D8D1B8;padding-top:6px}
.imp.wait{color:#6B7178}
.ecgwrap{overflow-x:auto;border-radius:4px}
.ecgwrap svg{display:block;min-width:620px;width:100%;height:auto;cursor:zoom-in}
.zoom{position:absolute;inset:0;z-index:20;background:var(--scrim);display:grid;place-items:center;padding:16px}
.zoom .imp{max-width:1100px;width:100%;max-height:100%;overflow:auto}

/* monitor */
.monitor{position:absolute;top:12px;right:12px;width:min(300px,46%);background:#05080A;border:1px solid #2A3238;border-radius:10px;padding:8px 10px 10px;z-index:3;color:#CFE;box-shadow:0 10px 30px rgba(0,0,0,.5);font-family:var(--f-mono)}
.monitor .mh{display:flex;justify-content:space-between;font-size:10.5px;color:#7F8C93;letter-spacing:.08em}
.monitor canvas{display:block;width:100%;height:54px}
.monitor .vals{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
.monitor .v{display:grid;line-height:1.05}
.monitor .v small{font-size:9.5px;color:#7F8C93;letter-spacing:.06em}
.monitor .v b{font-size:22px;font-weight:600}
.monitor .hr b{color:#4BE37A}.monitor .sp b{color:#4FD3F0}.monitor .pa b{color:#F2F2F2;font-size:17px}.monitor .fr b{color:#F4D35E}
.monitor .off{display:grid;place-items:center;height:96px;color:#7F8C93;font-size:12px;text-align:center;letter-spacing:.05em}
.monitor.alarm{border-color:#E5484D;box-shadow:0 0 0 2px rgba(229,72,77,.5),0 10px 30px rgba(0,0,0,.5)}

/* composer */
.composer{display:flex;gap:8px;align-items:center;padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--panel);border-top:1px solid var(--line);min-width:0}
.composer input{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:11px 14px;font-size:15px}
.composer select{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 8px;max-width:150px}
.rec-stop{background:var(--crit);border-color:var(--crit);color:#fff;font-weight:600}
.rec-stop svg.i{fill:currentColor}
.mic[aria-pressed="true"]{background:var(--crit);color:#fff;border-color:var(--crit);animation:pulse 1.2s infinite}
.aimode{font-size:12px}

/* feedback */
.fb{max-width:1080px;margin:0 auto;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:24px}
.fb-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
.ring{width:132px;height:132px}
.fb-head h1{font-size:clamp(26px,3.6vw,38px)}
.fb-head p{margin:6px 0 0;color:var(--muted)}
.doms{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.dom{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px}
.dom .row{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.dom .row b{font-family:var(--f-mono);font-size:18px}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.fb-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.card h2{font-size:19px}
.ck{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.ck:last-child{border-bottom:0}
.ck .mk{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.ck.y .mk{background:var(--ok-soft);color:var(--ok)}
.ck.n .mk{background:var(--crit-soft);color:var(--crit)}
.ck .ev{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.ck .dica{display:block;color:var(--warn);font-size:12.5px;margin-top:2px}
.ck .w{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ck .ia{font-family:var(--f-mono);font-size:10px;color:var(--accent);margin-left:6px}
.crit-list{display:grid;gap:8px}
.crit-list div{background:var(--crit-soft);color:var(--crit);border-radius:8px;padding:9px 12px;font-size:14px}
.ai-box{background:var(--accent-soft);border-radius:8px;padding:12px 14px;font-size:14.5px;display:grid;gap:8px}
.ai-box ul{margin:0;padding-left:18px}
.noimg{aspect-ratio:16/9;width:100%;display:grid;place-items:center;background:var(--sunk);color:var(--muted)}
.noimg svg.i{width:44px;height:44px;opacity:.6}
.noscene{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;background:radial-gradient(circle at 60% 40%,#1d3140,#0b141b);color:#8fa3b1;font-size:13px}
.noscene svg.i{width:64px;height:64px;opacity:.5}
.photo{margin:0;display:grid;gap:6px;background:#FFFEFA;color:#1D232A;border:1px solid #E2DCC6;border-radius:6px;padding:10px}
.photo img{width:100%;border-radius:4px;cursor:zoom-in;display:block}
.photo figcaption{font-size:12.5px;color:#4A535C}
.photo .req{font-size:13px;font-weight:500;color:#0E766F}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13.5px}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.gab{display:grid;gap:10px;font-size:14px}
.rt-wrap{display:grid;gap:20px}
.rt-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.rt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px 24px}
.rt-sec{display:grid;gap:2px;align-content:start}
.rt-sec .eyebrow{margin-bottom:4px;color:var(--accent)}
.rt-it{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;font-size:14px;padding:4px 0;border-bottom:1px solid var(--line);align-items:start}
.rt-it small{grid-column:2;color:var(--muted);font-size:12px}
.rt-it small.ev{display:block;grid-column:auto}
.rt-mk{font-weight:700;text-align:center}
.rt-it.y .rt-mk{color:var(--ok)}.rt-it.n .rt-mk{color:var(--crit)}.rt-it.na{color:var(--muted)}
.rt-it.manual{cursor:pointer}.rt-it.manual input{margin:3px 0 0;accent-color:var(--accent)}
.rt-dicas{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.gab ul{margin:0;padding-left:18px;display:grid;gap:4px}
.obito{position:absolute;inset:0;z-index:8;display:grid;place-content:center;justify-items:center;gap:6px;background:rgba(0,0,0,.72);color:#fff;text-align:center;animation:tin .6s ease-out;padding:16px}
.obito b{font-family:var(--f-display);font-size:clamp(40px,8vw,72px);letter-spacing:.08em}
.obito span{font-size:22px}
.obito small{font-size:14px;color:#cfd6dc;max-width:46ch}
.desfecho{border-radius:var(--r);padding:14px 16px;display:grid;gap:4px;font-size:14.5px}
.desfecho.obito-d{background:var(--crit-soft);color:var(--crit)}
.desfecho.vivo{background:var(--ok-soft);color:var(--ok)}
.desfecho.instavel{background:var(--warn-soft);color:var(--warn)}
.desfecho b{font-family:var(--f-display);font-size:20px}
.tline .tl.crit .w{color:var(--crit)}.tline .tl.ok .w{color:var(--ok)}.tline .tl.warn .w{color:var(--warn)}
.zoom img{max-width:100%;max-height:80vh;border-radius:4px;display:block;margin:0 auto}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width: 900px){
  .lobby-head{grid-template-columns:1fr}
  .fb-grid{grid-template-columns:1fr}
}
@media (max-width: 720px){
  .main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .rail{flex-direction:row;border-left:0;border-top:1px solid var(--line);overflow-x:auto;padding:4px}
  .tool{min-width:68px}
  .drawer{width:100%;bottom:66px}
  .stage.dopen .caption{left:50%;width:calc(100% - 32px)}
  .topbar .hide-sm{display:none}
  .timer{font-size:19px;padding:2px 8px}
  .cap{font-size:15px}
  .monitor{width:min(230px,60%)}
  .monitor .v b{font-size:17px}.monitor .pa b{font-size:14px}
  .composer select{max-width:104px}
  .fb-head{grid-template-columns:1fr}
}

<script>
"use strict";
/* =========================================================================
   ÍCONES
   ========================================================================= */
const I = {

  clip:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 10l2 2 4-4M9 16h6"/>',
  syringe:'<path d="M18 2l4 4M15 5l4 4M17 7L8 16l-3 1 1-3 9-9"/><path d="M11 7l6 6M3 21l3-3"/>',
  stop:'<rect x="6" y="6" width="12" height="12" rx="2"/>',
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',

  door:'<path d="M5 21V3h11v18M3 21h18M13 12h.01"/>',
  back:'<path d="M15 6l-6 6 6 6"/>',
};
const ic = (n, cls="i") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;

/* =========================================================================
   UTILITÁRIOS
   ========================================================================= */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const fmt = sec => { sec = Math.max(0, Math.round(sec)); return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0"); };
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* =========================================================================
   CATÁLOGO DE EXAMES (valores normais por padrão; cada caso sobrescreve)
   ========================================================================= */
const EXAMES = [
  {id:"hemograma", nome:"Hemograma completo", grupo:"Laboratório", t:6, res:"Hb 13,6 g/dL · Ht 40%\nLeucócitos 7.400/mm³ (diferencial normal)\nPlaquetas 248.000/mm³"},
  {id:"renal", nome:"Ureia e creatinina", grupo:"Laboratório", t:6, res:"Ureia 32 mg/dL\nCreatinina 0,9 mg/dL"},
  {id:"eletrolitos", nome:"Sódio e potássio", grupo:"Laboratório", t:6, res:"Na 139 mEq/L\nK 4,2 mEq/L"},
  {id:"glicemia", nome:"Glicemia de jejum", grupo:"Laboratório", t:5, res:"Glicemia 91 mg/dL"},
  {id:"hba1c", nome:"Hemoglobina glicada", grupo:"Laboratório", t:6, res:"HbA1c 5,3%"},
  {id:"lipidograma", nome:"Perfil lipídico", grupo:"Laboratório", t:6, res:"CT 182 · LDL 104 · HDL 52 · TG 128 mg/dL"},
  {id:"tsh", nome:"TSH e T4 livre", grupo:"Laboratório", t:6, res:"TSH 2,1 mUI/L\nT4L 1,2 ng/dL"},
  {id:"bnp", nome:"BNP / NT-proBNP", grupo:"Laboratório", t:7, res:"BNP 38 pg/mL"},
  {id:"troponina", nome:"Troponina ultrassensível", grupo:"Laboratório", t:9, res:"Troponina I us: 4 ng/L (ref. < 19)"},
  {id:"ddimero", nome:"D-dímero", grupo:"Laboratório", t:7, res:"D-dímero 220 ng/mL (ref. < 500)"},
  {id:"coag", nome:"Coagulograma (TP/TTPa)", grupo:"Laboratório", t:6, res:"TP 12,8 s · RNI 1,0\nTTPa 29 s"},
  {id:"gaso", nome:"Gasometria arterial", grupo:"Laboratório", t:4, res:"pH 7,41 · pCO2 39 · pO2 94 · HCO3 24 · SatO2 97%"},
  {id:"urina", nome:"Urina tipo 1", grupo:"Laboratório", t:6, res:"Densidade 1.018 · sem leucocitúria, hematúria ou proteinúria"},
  {id:"bhcg", nome:"Beta-hCG", grupo:"Laboratório", t:6, res:"Beta-hCG: negativo"},
  {id:"tox", nome:"Triagem toxicológica", grupo:"Laboratório", t:8, res:"Negativa para as substâncias pesquisadas"},
  {id:"ecg", nome:"Eletrocardiograma (12 derivações)", grupo:"Gráficos e imagem", t:3, ecg:{fc:76}},
  {id:"ecg_d", nome:"ECG com derivações direitas (V3R/V4R) e posteriores", grupo:"Gráficos e imagem", t:3, res:"V3R, V4R: sem alteração de ST\nV7–V9: sem alteração de ST"},
  {id:"rx", nome:"Radiografia de tórax (PA e perfil)", grupo:"Gráficos e imagem", t:8, res:"Área cardíaca normal. Campos pulmonares sem alterações. Seios costofrênicos livres."},
  {id:"eco", nome:"Ecocardiograma transtorácico", grupo:"Gráficos e imagem", t:10, res:"Câmaras de dimensões normais. FEVE 63% (Simpson). Valvas sem alterações."},
  {id:"tc_cranio", nome:"Tomografia de crânio", grupo:"Gráficos e imagem", t:10, res:"Sem alterações. Ausência de lesões expansivas ou sangramento."},
  {id:"rm_cranio", nome:"Ressonância de crânio", grupo:"Gráficos e imagem", t:12, res:"Sem alterações."},
];
const EXAME = Object.fromEntries(EXAMES.map(e => [e.id, e]));

/* =========================================================================
   AUXILIARES DE CHECKLIST
   Cada item tem test(s) → {ok, ev}. Itens com ia:true são revisados pelo avaliador IA (texto livre).
   ========================================================================= */
const quote = (t, q) => `${fmt(t)} — “${q.length>90 ? q.slice(0,88)+"…" : q}”`;
const T = (...ids) => s => { const h = ids.map(id => s.topics[id]).filter(Boolean).sort((a,b)=>a.t-b.t)[0]; return h ? {ok:true, ev:quote(h.t, h.q)} : {ok:false}; };
const M = (...ids) => s => { const h = ids.map(id => s.man[id]).filter(v=>v!=null).sort((a,b)=>a-b)[0]; return h!=null ? {ok:true, ev:`${fmt(h)} — manobra realizada`} : {ok:false}; };
const X = (...ids) => s => { const h = ids.map(id => s.exams[id] && {id, t:s.exams[id].t}).filter(Boolean).sort((a,b)=>a.t-b.t)[0]; return h ? {ok:true, ev:`${fmt(h.t)} — solicitou ${examDef(h.id).nome}`} : {ok:false}; };
const O = (...ids) => s => { const h = ids.map(id => s.orders[id]!=null && {id, t:s.orders[id]}).filter(Boolean).sort((a,b)=>a.t-b.t)[0]; return h ? {ok:true, ev:`${fmt(h.t)} — ordem: ${ordName(h.id)}`} : {ok:false}; };
const NO = (...ids) => s => { const g = ids.filter(id => s.orders[id]!=null); return g.length ? {ok:false, ev:`Prescreveu: ${g.map(id=>ordName(id)).join(", ")}`} : {ok:true, ev:"Não prescrito"}; };
const C = flag => s => s.com[flag] ? {ok:true, ev:quote(s.com[flag].t, s.com[flag].q)} : {ok:false};
const H = re => s => { const txt = norm(s.hip+" \n "+s.dif); return re.test(txt) ? {ok:true, ev:`Hipótese: “${s.hip||s.dif}”`} : {ok:false}; };
const K = re => s => {
  if (re.test(norm(s.conduta))) return {ok:true, ev:"Registrado na conduta"};
  const u = s.transcript.find(m => m.who==="me" && re.test(norm(m.text)));
  return u ? {ok:true, ev:quote(u.t, u.text)} : {ok:false};
};
const ANY = (...fs) => s => { for (const f of fs){ const r = f(s); if (r.ok) return r; } return {ok:false}; };
const ECG_BY = sec => s => { const e = s.exams.ecg; if (!e) return {ok:false, ev:"ECG não solicitado"}; return e.t <= sec ? {ok:true, ev:`ECG solicitado em ${fmt(e.t)}`} : {ok:false, ev:`ECG só em ${fmt(e.t)} (meta: até ${fmt(sec)})`}; };
const NOT_X = (...ids) => s => { const g = ids.filter(id => s.exams[id]); return g.length ? {ok:false, ev:`Solicitou ${g.map(id=>EXAME[id].nome).join(", ")} sem indicação`} : {ok:true, ev:"Sem exames de imagem desnecessários"}; };

const COM_RE = {
  apresentou:/(meu nome (e|eh)|me chamo|sou (o|a) (dr|doutor|doutora|medic|residente|estudante|academic|intern)|sou (dr|doutor|doutora)\b|\bsou (o |a )?[a-z]+,? (o |a )?(estudante|academic|intern|residente|medic)|sou estudante|estudante de medicina)/,
  empatia:/(entendo|imagino|compreendo|sinto muito|lamento|deve ser (dificil|complicado|ruim|pesado|assustador)|estou aqui|vamos (cuidar|resolver|juntos|te ajudar)|fique tranquil|obrigad[oa] por (contar|confiar|compartilhar|falar)|faz sentido (voce|o senhor|a senhora) (estar|se sentir)|e normal (sentir|ficar))/,
  entendimento:/(alguma duvida|ficou (claro|alguma duvida)|entendeu|tem alguma pergunta|quer perguntar|faz sentido pra|consegui explicar|pode me (dizer|repetir) o que entendeu)/,
  explicou:/(o que (o senhor|a senhora|voce) tem|seu (coracao|exame|problema)|suspeit|diagnostico|vamos (precisar|fazer|tratar|levar|encaminh)|o tratamento|isso (acontece|e causado|explica))/,
  sigilo:/(sigilo|confidencial|fica entre (nos|a gente)|segredo|nao vou contar)/,
};

/* =========================================================================
   ORDENS DA SALA DE EMERGÊNCIA
   ========================================================================= */
const ORDENS = [
  {id:"mov", nome:"Monitorização + acesso venoso", g:"Suporte", kw:/(monitor|acesso|veia|mov\b|puncion|cateter venoso)/},
  {id:"o2", nome:"O2 por cateter nasal 2 L/min", g:"Suporte", kw:/(oxigeni|o2|cateter nasal|oxigenio)/},
  {id:"glic", nome:"Glicemia capilar", g:"Suporte", kw:/(dextro|hgt|glicemia capilar)/},
  {id:"aas", nome:"AAS 300 mg mastigado", g:"Antitrombóticos", kw:/(aas|aspirina|acido acetil)/},
  {id:"p2y12", nome:"Clopidogrel 600 mg (ou ticagrelor 180 mg)", g:"Antitrombóticos", kw:/(clopidogrel|ticagrelor|prasugrel|p2y12)/},
  {id:"anticoag", nome:"Heparina não fracionada EV (bolus)", g:"Antitrombóticos", kw:/(heparina|enoxaparina|clexane|anticoagul)/},
  {id:"nitrato", nome:"Isossorbida 5 mg sublingual", g:"Sintomáticos", kw:/(isossorbida|isordil|nitrato|nitroglicerina|tridil)/},
  {id:"morfina", nome:"Morfina 2 mg EV", g:"Sintomáticos", kw:/(morfina)/},
  {id:"bb", nome:"Metoprolol 5 mg EV", g:"Sintomáticos", kw:/(metoprolol|betabloq|beta-bloq|esmolol)/},
  {id:"sf", nome:"SF 0,9% 500 mL EV em bolus", g:"Suporte", kw:/(soro|sf\b|cristaloide|volume|ringer|expans)/},
  {id:"icp", nome:"Acionar hemodinâmica (angioplastia primária)", g:"Reperfusão", kw:/(hemodinamica|cateterismo|angioplastia|icp|cate\b)/},
  {id:"trombolise", nome:"Tenecteplase EV (trombólise)", g:"Reperfusão", kw:/(tenecteplase|alteplase|trombolit|tnk|estreptoquinase|fibrinolit)/},
];
const ORD_NAME = Object.fromEntries(ORDENS.map(o => [o.id, o.nome]));

/* =========================================================================
   ECG (traçado desenhado a partir de parâmetros por derivação)
   ========================================================================= */
const LEADS_NORMAL = {
  DI:{r:.8,s:.1,t:.25}, DII:{r:1.1,s:.15,t:.3}, DIII:{r:.5,s:.1,t:.12}, aVR:{r:.9,s:.1,t:.25,inv:1}, aVL:{r:.45,s:.1,t:.12}, aVF:{r:.8,s:.12,t:.2},
  V1:{r:.25,s:1.0,t:.08}, V2:{r:.5,s:1.3,t:.35}, V3:{r:.9,s:.8,t:.4}, V4:{r:1.4,s:.4,t:.4}, V5:{r:1.5,s:.2,t:.35}, V6:{r:1.1,s:.1,t:.3}
};
/* Monta os parâmetros do traçado a partir da descrição escrita do ECG (casos do repositório). */
function ecgFromText(text){
  const t = String(text||"").replace(/\bD([123])\b/g, (m, d) => "D" + "I".repeat(+d)), n = norm(t);
  const fcm = n.match(/fc(?: media)?\s*(?:de\s*)?(\d{2,3})/) || n.match(/(\d{2,3})\s*bpm/);
  const cfg = {fc: fcm ? +fcm[1] : 75, rhythm:"sinus", leads:{}};
  if (/fibrilacao ventricular/.test(n)) cfg.rhythm = "vf";
  else if (/(fibrilacao atrial|ausencia de ondas? p|rr (totalmente )?irregular|ondas f\b)/.test(n)) cfg.rhythm = "af";
  else if (/(taquicardia regular de complexo estreito|sem onda p visivel|taquicardia supraventricular|tpsv)/.test(n)) cfg.rhythm = "svt";
  const LD = ["DI","DII","DIII","aVR","aVL","aVF","V1","V2","V3","V4","V5","V6"];
  const leadsIn = seg => {
    const out = new Set(); const re = /\b(DIII|DII|DI|aVR|aVL|aVF|V[1-6])\b(?:\s*[–-]\s*(V[1-6]))?/g; let m;
    while ((m = re.exec(seg))) { if (m[2]) { for (let k = +m[1][1]; k <= +m[2][1]; k++) out.add("V"+k); } else out.add(m[1]); }
    return [...out];
  };
  const after = (re) => { const res = []; let m; const g2 = new RegExp(re.source, "gi"); while ((m = g2.exec(t))) { const rest = t.slice(m.index + m[0].length); res.push(rest.split(/[;.)]|\s(com|e sem|sem)\s/i)[0]); } return res; };
  const set = (lds, k, v) => lds.forEach(l => { cfg.leads[l] = Object.assign(cfg.leads[l]||{}, {[k]: v}); });
  const has = re => { const g2 = new RegExp(re.source, "g"); let m; while ((m = g2.exec(n))) { if (!/(nao ha|sem|ausencia de|nao apresenta)[^.;]{0,25}$/.test(n.slice(Math.max(0, m.index - 30), m.index))) return true; } return false; };
  after(/supra(desnivelamento)?\s*(do segmento\s*)?(de\s*)?st/).forEach(seg => { const lds = leadsIn(seg); set(lds, "st", .28); set(lds, "t", .45); });
  after(/infra(desnivelamento)?\s*(do segmento\s*)?(de\s*)?(st\s*)?/).forEach(seg => set(leadsIn(seg), "st", -.15));
  after(/ondas?\s*q/).forEach(seg => { const inc = /incipiente/i.test(seg); set(leadsIn(seg), "q", inc ? .18 : .32); });
  after(/invers(ao|ão)\s*(da onda\s*|de\s*)?t/).forEach(seg => set(leadsIn(seg), "t", -.22));
  if (has(/s1q3t3/)) { set(["DI"], "s", .5); set(["DIII"], "q", .3); set(["DIII"], "t", -.2); }
  if (has(/(hve|sobrecarga ventricular esquerda|sokolow)/)) {
    set(["V1"], "s", 1.9); set(["V2"], "s", 2.2); set(["V5"], "r", 2.2); set(["V6"], "r", 1.8); set(["aVL"], "r", .9);
    if (/(repolariza|strain)/.test(n)) { set(["V5","V6","DI","aVL"], "st", -.08); set(["V5","V6","DI","aVL"], "t", -.18); }
  }
  if (has(/(\bbre\b|bloqueio de ramo esquerdo)/)) {
    cfg.wide = true;
    set(["V1","V2","V3"], "bre", "neg"); set(["V1","V2","V3"], "st", .1); set(["V1","V2","V3"], "t", .35);
    set(["DI","aVL","V5","V6"], "bre", "pos"); set(["DI","aVL","V5","V6"], "st", -.1); set(["DI","aVL","V5","V6"], "t", -.25);
  }
  if (has(/(\bbrd\b|bloqueio de ramo direito)/)) { set(["V1"], "rp", .35); set(["DI","V6"], "s", .25); }
  return cfg;
}
function ecgSVG(cfg){
  const fc = cfg.fc||75, RR = 60/fc, L = {}, rh_ = cfg.rhythm || "sinus";
  for (const k in LEADS_NORMAL) L[k] = Object.assign({}, LEADS_NORMAL[k], (cfg.leads||{})[k]||{});
  const g = (x,mu,sd,a) => a*Math.exp(-((x-mu)**2)/(2*sd*sd));
  const sm = (x,a,b) => x<=a?0:x>=b?1:((x-a)/(b-a))**2*(3-2*((x-a)/(b-a)));
  // instantes de cada batimento (irregulares na FA; semente fixa para o traçado não mudar)
  let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  const beats = []; for (let t = -RR*.6; t < 11; ) { beats.push(t); t += rh_==="af" ? RR*(.55 + .9*rnd()) : RR; }
  const tbOf = t => { let b = beats[0]; for (const x of beats){ if (x <= t) b = x; else break; } return t - b; };
  const W = cfg.wide ? 1 : 0, sh = W ? .03 : 0;
  const v = (t, P) => {
    if (rh_==="assist") return .015*Math.sin(2*Math.PI*.5*t);
    if (rh_==="sine") { const tt = ((t % RR) + RR) % RR; const y = .85*Math.sin(2*Math.PI*tt/RR) * (P.r > .6 ? 1 : .7); return P.inv ? -y : y; }
    if (rh_==="tv") { const tb2 = ((t % RR) + RR) % RR; const A = (P.r - (P.s||.1)) >= 0 ? 1.1 : -1.1; const y = g(tb2,.09,.04,A) + g(tb2,.21,.055,-A*.55); return P.inv ? -y : y; }
    if (rh_==="vf") { const y = .45*Math.sin(2*Math.PI*4.3*t + (P.r||1)) + .3*Math.sin(2*Math.PI*6.1*t + 1) + .2*Math.sin(2*Math.PI*2.7*t + 2); return y; }
    const tb = tbOf(t);
    let y = 0;
    if (rh_==="sinus") y += g(tb,.08,.022,.12);
    if (rh_==="af") y += .035*Math.sin(2*Math.PI*6.7*t + (P.r||0)*3) + .02*Math.sin(2*Math.PI*10.9*t + 1.3);
    if (W) {
      if (P.bre==="neg") y += g(tb,.205,.012,.12) + g(tb,.25,.032,-(P.s||1.5));
      else if (P.bre==="pos") y += g(tb,.215,.022,P.r*.9) + g(tb,.255,.022,P.r);
      else y += g(tb,.22,.026,P.r) + g(tb,.26,.02,-(P.s||.1));
    } else {
      y += g(tb,.19,P.q?.016:.008,-(P.q||.04)) + g(tb,.215,.011,P.r) + g(tb,.24,.011,-(P.s||.1));
      if (P.rp) y += g(tb,.258,.009,P.rp);
    }
    y += (P.st||0) * sm(tb,.245+sh,.29+sh) * (1 - sm(tb,.40+sh,.48+sh));
    y += g(tb,.40+sh,P.tsd||.045,P.t);
    return P.inv ? -y : y;
  };
  const pxs = 100, mv = 40, cw = 250, rh = 110;
  const path = (lead, x0, y0, t0, dur) => { let d = ""; for (let t=0; t<=dur; t+=.004){ d += (t?"L":"M")+(x0+t*pxs).toFixed(1)+","+(y0 - v(t0+t, L[lead])*mv).toFixed(1); } return d; };
  const rows = [["DI","aVR","V1","V4"],["DII","aVL","V2","V5"],["DIII","aVF","V3","V6"]];
  let paths = "", labels = "";
  rows.forEach((row, ri) => row.forEach((ld, ci) => {
    const x0 = ci*cw, y0 = 62 + ri*rh;
    paths += `<path d="${path(ld, x0, y0, ci*2.5, 2.5)}"/>`;
    labels += `<text x="${x0+6}" y="${y0-34}">${ld}</text>`;
  }));
  const yR = 62 + 3*rh;
  paths += `<path d="${path("DII", 0, yR, 0, 10)}"/>`; labels += `<text x="6" y="${yR-34}">DII longo</text>`;
  const H = yR + 50;
  return `<svg viewBox="0 0 1000 ${H}" role="img" aria-label="Eletrocardiograma de 12 derivações">
    <defs><pattern id="s" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M4 0H0V4" fill="none" stroke="#F3C9C9" stroke-width=".5"/></pattern>
    <pattern id="b" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="url(#s)"/><path d="M20 0H0V20" fill="none" stroke="#E79A9A" stroke-width=".9"/></pattern></defs>
    <rect width="1000" height="${H}" fill="#FFF8F6"/><rect width="1000" height="${H}" fill="url(#b)"/>
    <g fill="none" stroke="#1B1F24" stroke-width="1.35" stroke-linejoin="round">${paths}</g>
    <g font-family="IBM Plex Mono, monospace" font-size="13" fill="#1B1F24">${labels}<text x="994" y="${H-8}" text-anchor="end" font-size="11">25 mm/s · 10 mm/mV</text></g></svg>`;
}

function dynTick(){

function anamnese(base, outros){
  const out = [];
  for (const [id, r] of Object.entries(base)){ const d = AN[id]; if (d) out.push({id, g:d.g, q:d.q, kw:d.kw, r}); }
  outros.forEach(h => out.push(Object.assign({g:"História da doença atual"}, h)));
  AN_GERAL.forEach(gn => { if (!out.some(t => t.id === gn.id)) out.push(Object.assign({gen:true}, gn)); });
  return out.sort((a, b) => AN_ORDEM.indexOf(a.g) - AN_ORDEM.indexOf(b.g));
}

    {d:"Anamnese", l:"Interrogatório sintomatológico (pergunta sobre outros sistemas)", w:1, test:n("Interrogatório sintomatológico", 3)},
    {d:"Anamnese", l:"Antecedentes pessoais (doenças, remédios, alergias)", w:1, test:TN(["dp","meds","alergia","cirurgia"], 2)},

function tick(){
  if (!S || S.ended) return;
  const c = S.c, el = now(), rem = c.tempo - el;
  const t = $("#timer"); if (t){ t.textContent = fmt(rem); t.className = "timer" + (rem<=30 ? " crit" : rem<=120 ? " warn" : ""); }
  if (rem<=120 && !S.warned.w2){ S.warned.w2=1; beep(660,.12); toast("Faltam 2 minutos.", "warn"); }
  if (rem<=30 && !S.warned.w30){ S.warned.w30=1; beep(660,.12); setTimeout(()=>beep(660,.12),200); }
  if (c.dyn) dynTick();
  if (c.emergencia || c.monitor || c.dyn) evolveVitals(el);
  if (rem <= 0) endStation("tempo");
}

function confirmInline(msg, yes){
  const host = $("#toasts"); if (!host) return yes();
  const d = document.createElement("div");
  d.className = "toast warn"; d.style.pointerEvents = "auto";
  d.innerHTML = `<div style="display:grid;gap:8px"><span>${esc(msg)}</span><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost" data-a="n">Continuar na estação</button><button class="btn primary" data-a="y">Confirmar</button></div></div>`;
  host.appendChild(d);
  d.querySelector('[data-a="n"]').onclick = () => d.remove();
  d.querySelector('[data-a="y"]').onclick = () => { d.remove(); yes(); };
}
function toast(msg, kind=""){
  const host = $("#toasts"); if (!host) return;
  const d = document.createElement("div"); d.className = "toast " + kind; d.textContent = msg; host.appendChild(d);
  setTimeout(() => d.remove(), 5200);
}
let actx = null;
function unlockAudio(){ try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); }catch(e){} }
function tone(f, dur, vol=.08, when=0, type="sine"){
  try{
    unlockAudio(); if (!actx) return;
    const t0 = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f;

    const ords = new Set(reply.ordens || []);
    for (const o of ordList()) if (o.kw.test(norm(text)) && ORD_VERB.test(norm(text))) ords.add(o.id);

  }

}

function localPatient(text){
  const n = norm(text), c = S.c;
  let hits = c.topicos.filter(tp => tp.kw.test(n));
  if (hits.some(h => /^hda_(conte|fatores|assoc)$/.test(h.id))) hits = hits.filter(h => /^hda_(conte|fatores|assoc)$/.test(h.id));
  if (hits.some(h => h.gen) && hits.some(h => !h.gen)){
    // pergunta casou com tópico do caso e com tópico geral: vence a palavra-chave mais específica (mais longa)
    const len = h => { const m = h.kw.exec(n); return m ? m[0].length : 0; };
    const bg = Math.max(...hits.filter(h => h.gen).map(len)), bs = Math.max(...hits.filter(h => !h.gen).map(len));
    hits = bg > bs ? hits.filter(h => h.gen) : hits.filter(h => !h.gen);
  }
  if (!hits.length && c.repo){
    // reserva: aproxima pelo conteúdo das falas e por quem foi chamado (mãe, enfermagem, SAMU...)
    const mine = new Set(stems(text));
    const role = /\b(mae|pai|filh[oa]|familia|esposa|marido|senhora da familia)\b/.test(n) ? "Família" : /\b(enfermeir[oa]|enfermagem|equipe|tecnic[oa])\b/.test(n) ? "Enfermagem" : /\bsamu\b/.test(n) ? "SAMU" : "";
    let best = null, bs = 0;
    for (const tp of c.topicos){ if (tp.ativo) continue; let sc = stems(tp.trig+" "+tp.r).filter(x => mine.has(x)).length; if (role && (tp.quem === role || (role === "Família" && tp.quem === "Mãe"))) sc += 1.5; if (S.topics[tp.id]) sc -= .5; if (sc > bs){ bs = sc; best = tp; } }
    if (best && bs >= 1) hits = [best];
  }
  if (!hits.length && S.dyn && dynConsc() === "sonolento") return {fala:"(Geme e abre os olhos devagar) …hum… doutor…", emocao:"sonolento"};
  if (!hits.length){
    if (/(bom dia|boa tarde|boa noite|\bola\b|\boi\b|tudo bem|prazer)/.test(n)) return {fala: c.id==="rafael" ? "Oi. Tudo bem..." : "Bom dia, doutor.", emocao:"neutro"};
    if (/(examin|vou (te |lhe )?examinar|posso (te |lhe )?examinar|deitar|tirar a blusa)/.test(n)) return {fala:"Pode sim, doutor.", emocao:"neutro"};
    if (COM_RE.explicou.test(n)) return {fala:"Entendi, doutor. E isso tem tratamento?", emocao:"preocupado"};
    return {fala:"Desculpa, doutor, não entendi direito. Pode perguntar de outro jeito?", emocao:"neutro"};
  }
  const fresh = hits.filter(tp => !S.topics[tp.id]);
  const pick = (fresh.length ? fresh : hits).slice(0, 2);
  return {fala: pick.map(tp => tp.r).join(" "), quem: pick[0].quem || "", topicos: hits.map(h=>h.id), emocao: c.id==="rafael" ? "triste" : c.emergencia ? "com dor" : "neutro"};
}

    <div class="fb-grid">

        ${domOrder.map(d => `<div><div class="eyebrow" style="margin:8px 0 2px">${esc(d)}</div>${R.items.filter(it=>it.d===d).map(it => `<div class="ck ${it.ok?"y":"n"}"><span class="mk">${it.ok?"✓":"✕"}</span><div>${esc(it.l)}${it.byAI?`<span class="ia">IA</span>`:""}${it.ev?`<span class="ev">${esc(it.ev)}</span>`:""}${!it.ok && it.dica?`<span class="dica">${esc(it.dica)}</span>`:""}</div><span class="w">${String(it.w).replace(".",",")}</span></div>`).join("")}</div>`).join("")}
      </div>
      <div style="display:grid;gap:20px;min-width:0">
        ${aiBox ? `<div class="card">${aiBox}</div>` : ""}
        ${c.gabarito ? gabaritoHTML(c.gabarito) : ""}
        <div class="card"><h2>Sua hipótese e conduta</h2>
          <dl class="kv"><dt>Hipótese</dt><dd>${esc(S.hip)||"<span class='note'>não registrada</span>"}</dd><dt>Diferenciais</dt><dd>${esc(S.dif)||"—"}</dd></dl>
          <div class="note" style="white-space:pre-wrap">${esc(S.conduta)||"Conduta não registrada por escrito."}</div>
          ${c.emergencia ? `<div><div class="eyebrow">Ordens executadas</div>${Object.keys(S.orders).sort((a,b)=>S.orders[a]-S.orders[b]).map(k=>`<div class="tl"><span class="w">${fmt(S.orders[k])}</span>${esc(ORD_NAME[k])}</div>`).join("") || "<span class='note'>Nenhuma</span>"}</div>` : ""}
        </div>
        <div class="card"><h2>Transcrição</h2><div class="transcript" style="max-height:420px;overflow:auto">${S.transcript.length ? S.transcript.map(m => `<div class="tl ${m.who==="me"?"me":""}"><span class="w">${m.who==="me"?"Você":esc(m.label || speakerName(m.who))} · ${fmt(m.t)}</span>${esc(m.text)}</div>`).join("") : "<span class='note'>Sem falas registradas.</span>"}</div></div>
      </div>
    </div>
    ${c.area === "P1 duda" && c.id !== "p1-spikes" ? roteiroP1HTML() : ""}
  </div></section>`;
  window.scrollTo(0,0);
  $("#again").onclick = () => renderDoor(c.id);
  $("#toLobby").onclick = renderLobby;
  if (ai===undefined && CAP.sample && !CAP.aiOff) runAIEval();
}
function desfechoHTML(){
  const st = S.dyn, cls = st.obito ? "obito-d" : st.estavel ? "vivo" : "instavel";
  const tit = st.obito ? `Óbito às ${fmt(st.obitoT)}` : st.estavel ? "Paciente vivo e estabilizado" : "Paciente vivo, mas ainda instável";
  const sub = st.obito ? st.motivo : st.rosc ? `Houve ${st.rosc} parada(s) revertida(s).` : st.estavel ? "As condutas certas, no tempo certo, reverteram a piora." : "Faltou tratar a causa a tempo: o quadro ainda piorava ao fim da estação.";
  const linhas = st.ev.slice().sort((a,b) => a.t-b.t).map(e => `<div class="tl ${e.kind}"><span class="w">${fmt(e.t)}${e.kind==="ordem" ? " · ordem" : ""}</span>${esc(e.txt)}</div>`).join("");
  return `<div class="desfecho ${cls}"><b>${esc(tit)}</b><span>${esc(sub)}</span></div>
    <div class="card"><h2>Linha do tempo</h2><div class="transcript tline">${linhas || "<span class='note'>Nenhuma ordem dada.</span>"}</div></div>`;
}
function gabaritoHTML(g){
  const li = arr => `<ul>${arr.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
  return `<div class="card gab"><h2>Gabarito da estação</h2>
    ${g.diag ? `<div><div class="eyebrow">Diagnóstico</div>${esc(g.diag)}</div>` : ""}
    ${g.foto ? `<div><div class="eyebrow">Fotodescrição esperada</div>${li(splitP(g.foto))}</div>` : ""}
    ${(g.difs||[]).length ? `<div><div class="eyebrow">Diferenciais</div>${li(g.difs)}</div>` : ""}
    ${(g.exames||[]).length ? `<div><div class="eyebrow">Exames esperados</div>${li(g.exames.map(e => `${e.exam}: ${e.expected||e.justify||""}`))}</div>` : ""}
    ${g.conduta ? `<div><div class="eyebrow">Conduta esperada</div>${li(splitP(g.conduta))}</div>` : ""}
    ${(g.achados||[]).length ? `<div><div class="eyebrow">${S.c.id === "p1-spikes" ? "As 6 etapas do SPIKES" : "Achados esperados"}</div>${li(g.achados)}</div>` : ""}
    ${(g.modelo||[]).length ? `<div><div class="eyebrow">${S.c.id === "p1-spikes" ? "Exemplo de condução" : "Anamnese modelo"}</div>${g.modelo.map(([t, x]) => `<p style="margin:0 0 6px"><b>${esc(t)}:</b> ${esc(x)}</p>`).join("")}</div>` : ""}
  </div>`;
}
async function runAIEval(){
  const c = S.c, snap = S;
  renderFeedback(undefined, "loading");
  const iaItems = c.checklist.map((it,i)=>({it,i})).filter(x=>x.it.ia);
  const prompt = `Você é um avaliador de OSCE (exame clínico objetivo estruturado) de medicina no Brasil, rigoroso e justo.
ESTAÇÃO: ${c.titulo}. Paciente: ${c.pac.nome}, ${idadeStr(c.pac)}. ${c.enunciado}
TAREFAS: ${c.tarefas.join(" ")}
HIPÓTESE ESCRITA PELO ALUNO: "${S.hip}"
DIFERENCIAIS: "${S.dif}"
CONDUTA ESCRITA: "${S.conduta}"
${c.emergencia || c.dyn ? "ORDENS EXECUTADAS: " + (Object.keys(S.orders).map(k=>ordName(k)+" ("+fmt(S.orders[k])+")").join("; ")||"nenhuma") : ""}${S.dyn ? "\nDESFECHO: " + (S.dyn.obito ? "óbito" : S.dyn.estavel ? "estabilizado" : "instável") : ""}
MANOBRAS DE EXAME FÍSICO REALIZADAS: ${c.exame.flatMap(g=>g.itens).filter(it=>S.man[it.id]!=null).map(it=>it.nome).join("; ") || "nenhuma"}
EXAMES SOLICITADOS: ${Object.keys(S.exams).map(id=>examDef(id).nome).join("; ") || "nenhum"}
ANOTAÇÕES DO ALUNO: "${S.notas}"
FALAS DO ALUNO NA CONSULTA:
${S.transcript.filter(m=>m.who==="me").map(m=>`[${fmt(m.t)}] ${m.text}`).join("\n") || "(nenhuma)"}
Avalie SOMENTE estes itens do checklist (true = cumprido de forma clara e correta pelo que foi escrito ou dito; considere negações: "não vou dar X" não conta como dar X):
${iaItems.map(x=>`${x.i}: ${x.it.l}`).join("\n")}
${(c.criticosTexto||[]).length ? `ERROS CRÍTICOS POSSÍVEIS (marque em "criticos" os índices que o aluno COMETEU de fato; na dúvida, não marque):\n${c.criticosTexto.map((t,i)=>`${i}: ${t}`).join("\n")}\n` : ""}Responda SOMENTE JSON: {"itens":{"<número>":true|false,...},"criticos":[índices],"comentario":"2 a 4 frases, tom de preceptor, dirigidas ao aluno (você)","fortes":["até 3"],"melhorar":["até 3, específicos e acionáveis"]}`;
  try{
    const r = await CAP.sample.json(prompt, {modelTier:"default", cache:false});
    if (S !== snap) return;
    const ov = {};
    if (r && r.itens) for (const k in r.itens) ov[+k] = !!r.itens[k];
    if (r && Array.isArray(r.criticos)) S.critIA = r.criticos.map(Number).filter(n => Number.isInteger(n));
    renderFeedback(ov, r || {});
  }catch(e){
    if (S !== snap) return;
    renderFeedback(undefined, {comentario: e?.code==="not_granted" ? "" : "O avaliador IA não respondeu. A correção acima usa o reconhecimento automático do texto."});
  }
}

renderLobby();
loadRepoCases();
</script>
